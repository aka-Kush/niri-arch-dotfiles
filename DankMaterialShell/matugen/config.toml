[config]

[templates.spotify]
input_path = '~/.config/matugen/templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'spicetify watch -s 2>&1 | sed "/Reloaded Spotify/q"'

[templates.Obsidian]
input_path = "~/.config/matugen/templates/obsidian.css" 
output_path = "~/Documents/obsidian-vault/.obsidian/themes/obsidian.css"

[templates.neovim]
input_path = '/home/kush/.config/matugen/templates/neovim.lua'
output_path = '~/.config/nvim/lua/plugins/colors.lua'
post_hook = "pkill -SIGUSR1 nvim"
