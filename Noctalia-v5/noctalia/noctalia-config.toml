[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.79999998211860657
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
font_family = "Adwaita Sans"
font_weight = 600
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces", "media" ]

[battery]
warning_threshold = 20

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.emoji]
        global = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [
        "opencode",
        "spicetify",
        "brave-origin",
        "discord",
        "neovim",
        "obsidian",
        "zed",
        "thunderbird",
        "papirus-icons",
        "bat"
    ]

[wallpaper]
directory = "/home/kush/Pictures/walls"

    [wallpaper.default]
    path = "/home/kush/Pictures/walls/0072.png"

    [wallpaper.last]
    path = "/home/kush/Pictures/walls/0072.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/kush/Pictures/walls/0072.png"

[widget.battery]
font_scale = 0.85000000000000009

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%I:%M:%S}"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.workspaces]
hide_when_empty = true
